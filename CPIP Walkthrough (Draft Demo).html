document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"05a8bf32-85ad-4350-a41d-08d8b8636395\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   CBRE Brand Webfonts\n   Financier Display — primary editorial serif (headlines)\n   Calibre          — secondary sans (body, UI, supporting)\n   Space Mono       — detail/technical copy (labels, dates)\n   ============================================================ */\n\n/* ---------- Financier Display ---------- */\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"c72a4abd-33dd-4f67-9c65-c611e47c7b2f\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"ce01c020-0718-4872-8b9e-a6c2f3454963\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"77da2c05-0736-4d5e-8eb2-bb5de9fbe055\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"37d99aa0-c0a7-486a-afc2-8fd49d40f808\") format(\"opentype\");\n  font-weight: 500;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"d4525d44-ce45-4c4c-97df-1c8ea8c891c9\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"25a5f3e3-aa76-426d-acf6-382a03250618\") format(\"opentype\");\n  font-weight: 600;\n  font-style: italic;\n  font-display: swap;\n}\n\n/* ---------- Calibre ---------- */\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"61c7bf64-abb4-4286-b6d5-5917bee366fd\") format(\"opentype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"dd363430-e46b-4b41-8790-02aeaa2df8b9\") format(\"opentype\");\n  font-weight: 300;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"27464b5f-be49-45f2-8258-3a93e58ee883\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"a56b1e04-5ab8-4532-aa95-dfa65fbdc035\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"b032ac0b-9954-4ed3-ab33-7ebd729c33f5\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"bbbdec52-1bea-4718-8b03-0f726b803c7f\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"a9356d3e-6c0f-4c5a-9cae-578a5f2d67d2\") format(\"opentype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- Space Mono ---------- */\n@font-face {\n  font-family: \"Space Mono\";\n  src: url(\"39f16cef-df29-490a-aac9-3195e020cb8d\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CBRE Color System — 2026 \"Global Emerald\" Brand\n   Use RGB/Hex values exactly as provided for all digital work.\n   CBRE Green leads; Accent Green is used sparingly for energy.\n   ============================================================ */\n\n:root {\n  /* ---------- Primary palette ---------- */\n  --cbre-green: #003F2D;        /* The hero. Pantone 3435 C */\n  --cbre-accent-green: #17E88F; /* Electric neon — use sparingly. Pantone 7479 C */\n  --cbre-dark-green: #012A2D;   /* Deepest surface. Pantone 627 C */\n  --cbre-dark-grey: #435254;    /* Body text on light. Pantone 431 C */\n  --cbre-light-grey: #CAD1D3;   /* Hairlines, dividers. Pantone 428 C */\n\n  /* ---------- Secondary palette (+ approved tints) ---------- */\n  --cbre-midnight: #032842;\n  --cbre-midnight-tint: #778F9C;\n  --cbre-sage: #538184;\n  --cbre-sage-tint: #96B3B6;\n  --cbre-celadon: #80BBAD;\n  --cbre-celadon-tint: #C0D4CB;\n  --cbre-wheat: #DBD99A;\n  --cbre-wheat-tint: #EFECD2;\n  --cbre-cement: #7F8480;\n  --cbre-cement-tint: #CBCDCB;\n\n  /* ---------- Neutrals ---------- */\n  --cbre-white: #FFFFFF;\n  --cbre-black: #000000;\n  /* Accent Green's lighter approved tint */\n  --cbre-accent-green-tint: #45EDA5;\n\n  /* ---------- Data visualization ---------- */\n  /* Charts & graphs (data-driven, color-blind ordered) */\n  --cbre-data-celadon: #80BBAD;\n  --cbre-data-dark-grey: #435254;\n  --cbre-data-accent-green: #17E88F;\n  --cbre-data-wheat: #DBD99A;\n  --cbre-data-blue: #1F3765;\n  --cbre-data-light-blue: #3E7CA6;\n  --cbre-data-light-grey: #CAD1D3;\n  --cbre-data-negative-red: #AD2A2A; /* Only for negative values */\n  /* Infographics & diagrams (info-driven) */\n  --cbre-data-orange: #D2785A;\n  --cbre-data-purple: #885073;\n  --cbre-data-light-purple: #A388BF;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reach for these in product/UI work\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page: var(--cbre-white);\n  --surface-raised: var(--cbre-white);\n  --surface-sunken: #F4F6F5;          /* near-white green-grey wash */\n  --surface-brand: var(--cbre-green); /* hero brand surface */\n  --surface-brand-deep: var(--cbre-dark-green);\n  --surface-inverse: var(--cbre-dark-green);\n  --surface-wheat: var(--cbre-wheat-tint);\n  --surface-celadon: var(--cbre-celadon-tint);\n\n  /* Text */\n  --text-strong: var(--cbre-green);     /* headlines on light */\n  --text-body: var(--cbre-dark-grey);   /* body — softer than black */\n  --text-muted: var(--cbre-cement);     /* captions, meta */\n  --text-on-brand: var(--cbre-white);   /* text on green surfaces */\n  --text-on-brand-muted: var(--cbre-celadon);\n  --text-accent: var(--cbre-accent-green);\n\n  /* Lines & borders */\n  --border-subtle: var(--cbre-light-grey);\n  --border-strong: var(--cbre-dark-grey);\n  --line-of-sight: var(--cbre-accent-green); /* default Line of Sight color */\n\n  /* Interactive */\n  --action-primary: var(--cbre-green);\n  --action-primary-hover: #00543C;    /* CBRE Green lightened */\n  --action-primary-press: var(--cbre-dark-green);\n  --action-accent: var(--cbre-accent-green);\n  --action-accent-hover: var(--cbre-accent-green-tint);\n  --focus-ring: var(--cbre-accent-green);\n\n  /* Feedback */\n  --feedback-negative: var(--cbre-data-negative-red);\n  --feedback-positive: var(--cbre-green);\n  --feedback-info: var(--cbre-data-light-blue);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CBRE Typography Tokens\n   Financier Display  → headlines / primary messaging (title case, never all-caps)\n   Calibre            → body, UI, supporting headlines (all-caps OK for hero)\n   Space Mono         → detail copy: labels, dates, locations (all-caps, <5 words)\n   Barlow Condensed   → dense charts/graphs only (loaded from Google Fonts)\n   ============================================================ */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7c97ab61-f5bd-4919-b37e-64f58868c3e4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f1fb6aac-3e6b-4cc7-b4c1-4bcc0db666ec\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"48e9aab7-b076-42c1-8c6a-0d15b890f52c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- Families ---------- */\n  --font-display: \"Financier Display\", \"Times New Roman\", Times, serif;\n  --font-sans: \"Calibre\", \"Tahoma\", system-ui, -apple-system, sans-serif;\n  --font-mono: \"Space Mono\", ui-monospace, \"Courier New\", monospace;\n  --font-condensed: \"Barlow Condensed\", \"Calibre\", sans-serif;\n\n  /* ---------- Weights ---------- */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---------- Display scale (Financier Display) ---------- */\n  /* Brand spec: tracking tightens & leading drops as size grows */\n  --display-1: 150px;   /* hero */\n  --display-2: 120px;\n  --display-3: 90px;\n  --display-4: 64px;\n  --display-5: 48px;\n  --display-6: 32px;\n  --display-leading-tight: 0.95;  /* >100pt */\n  --display-leading: 1;           /* 20–100pt */\n  --display-tracking-tight: -0.015em; /* ~ -5 at 100pt+ */\n  --display-tracking: 0;\n\n  /* ---------- Heading scale (Calibre supporting) ---------- */\n  --heading-1: 48px;\n  --heading-2: 32px;\n  --heading-3: 24px;\n  --heading-4: 20px;\n  --heading-leading: 1.1;\n\n  /* ---------- Body scale (Calibre) ---------- */\n  --body-lg: 20px;\n  --body-md: 16px;\n  --body-sm: 14px;\n  --body-xs: 13px;\n  --body-leading: 1.2;     /* brand spec: 120% */\n  --body-leading-relaxed: 1.5;\n\n  /* ---------- Detail / mono (Space Mono) ---------- */\n  --detail-md: 14px;\n  --detail-sm: 12px;\n  --detail-tracking: 0.04em;\n  --detail-leading: 1.3;\n\n  /* ---------- Label / eyebrow ---------- */\n  --label-md: 13px;\n  --label-sm: 11px;\n  --label-tracking: 0.08em;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CBRE Spacing, Radii, Borders, Shadows, Line of Sight\n   The brand is built on a 12-column grid, generous white space,\n   and the rectangular \"Line of Sight\" graphic element.\n   The aesthetic is crisp and architectural: minimal radius,\n   restrained shadows, square-cut corners on icons & lines.\n   ============================================================ */\n\n:root {\n  /* ---------- Spacing scale (4px base) ---------- */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---------- Layout ---------- */\n  --grid-columns: 12; /* @kind other */\n  --grid-gutter: 24px;\n  --layout-max: 1280px;\n  --layout-margin: 64px;     /* \"margins as picture frames\" */\n  --layout-margin-thin: 10px; /* professional thin photo frame */\n\n  /* ---------- Radii ----------\n     CBRE reads architectural & precise: corners are mostly square.\n     A small radius is used on interactive UI surfaces only. */\n  --radius-none: 0;\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 8px;\n  --radius-pill: 999px;\n\n  /* ---------- Borders ---------- */\n  --border-hairline: 1px;\n  --border-regular: 2px;   /* matches icon stroke weight */\n  --border-heavy: 4px;\n\n  /* ---------- Line of Sight weights (px = pt) ---------- */\n  --los-1: 1px;\n  --los-2: 2px;\n  --los-5: 5px;\n  --los-10: 10px;\n  --los-20: 20px;\n  --los-50: 50px;\n  --los-100: 100px;\n\n  /* ---------- Shadows ----------\n     Used sparingly — CBRE favors flat, confident surfaces with\n     hairline borders over heavy elevation. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(1, 42, 45, 0.06);\n  --shadow-md: 0 4px 16px rgba(1, 42, 45, 0.08);\n  --shadow-lg: 0 12px 32px rgba(1, 42, 45, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(23, 232, 143, 0.45);\n\n  /* ---------- Motion ----------\n     Calm, confident, no bounce. Short eases. */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  /* ---------- Color Glaze gradient (signature background) ---------- */\n  --color-glaze: radial-gradient(120% 120% at 15% 10%, #0a5a40 0%, #00432f 38%, #012a2d 78%, #001f20 100%);\n  --color-glaze-soft: radial-gradient(140% 120% at 80% 0%, #17e88f22 0%, #00432f00 45%), linear-gradient(135deg, #003f2d 0%, #012a2d 100%);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CBRE Base — element defaults built on the token layer.\n   Applies brand type, color, and rendering defaults.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--body-md);\n  line-height: var(--body-leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n}\n\n/* Headlines default to Financier Display, CBRE Green, title-case spirit */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-medium);\n  color: var(--text-strong);\n  line-height: var(--display-leading);\n  letter-spacing: var(--display-tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\nh1 { font-size: var(--display-4); }\nh2 { font-size: var(--display-6); }\nh3 { font-size: var(--heading-3); }\nh4 { font-size: var(--heading-4); }\n\np {\n  margin: 0 0 var(--space-4);\n  line-height: var(--body-leading-relaxed);\n  text-wrap: pretty;\n}\n\na {\n  color: var(--cbre-green);\n  text-decoration: none;\n}\na:hover {\n  text-decoration: underline;\n}\n\n/* Eyebrow / detail copy convention (Space Mono, all caps) */\n.cbre-eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--detail-sm);\n  letter-spacing: var(--detail-tracking);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* The Line of Sight — signature rectangular accent */\n.cbre-los {\n  display: block;\n  background: var(--line-of-sight);\n  border: 0;\n}\n.cbre-los--h { height: var(--los-5); width: 120px; }\n.cbre-los--v { width: var(--los-5); height: 120px; }\n\n/* Button interaction states (component sets .cbre-btn--<variant>) */\n.cbre-btn:not(:disabled):active { transform: translateY(0.5px); }\n.cbre-btn--primary:not(:disabled):hover { background: var(--action-primary-hover) !important; border-color: var(--action-primary-hover) !important; }\n.cbre-btn--primary:not(:disabled):active { background: var(--action-primary-press) !important; border-color: var(--action-primary-press) !important; }\n.cbre-btn--secondary:not(:disabled):hover { background: var(--surface-sunken) !important; }\n.cbre-btn--ghost:not(:disabled):hover { background: var(--surface-sunken) !important; }\n.cbre-btn--accent:not(:disabled):hover { background: var(--action-accent-hover) !important; border-color: var(--action-accent-hover) !important; }\n.cbre-btn--inverse:not(:disabled):hover { background: var(--cbre-celadon-tint) !important; border-color: var(--cbre-celadon-tint) !important; }\n\n.cbre-input:focus, .cbre-input:focus-visible,\n.cbre-select:focus, .cbre-select:focus-visible,\n.cbre-textarea:focus, .cbre-textarea:focus-visible {\n  border-color: var(--cbre-green) !important;\n  box-shadow: var(--shadow-focus);\n}\n.cbre-input::placeholder, .cbre-textarea::placeholder { color: var(--cbre-cement); }\n\n/* ---------- Checkbox & Radio ---------- */\n.cbre-checkbox, .cbre-radio {\n  appearance: none;\n  -webkit-appearance: none;\n  width: 20px; height: 20px;\n  margin: 0; flex: none;\n  background: var(--cbre-white);\n  border: 2px solid var(--cbre-dark-grey);\n  cursor: inherit;\n  display: inline-grid; place-content: center;\n  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);\n}\n.cbre-checkbox { border-radius: var(--radius-sm); }\n.cbre-radio { border-radius: var(--radius-pill); }\n.cbre-checkbox::before {\n  content: \"\"; width: 11px; height: 11px;\n  transform: scale(0); transform-origin: center;\n  transition: transform var(--duration-fast) var(--ease-out);\n  box-shadow: inset 1em 1em var(--cbre-white);\n  clip-path: polygon(14% 44%, 0 65%, 43% 100%, 100% 16%, 80% 0%, 39% 67%);\n}\n.cbre-radio::before {\n  content: \"\"; width: 9px; height: 9px; border-radius: var(--radius-pill);\n  transform: scale(0); transition: transform var(--duration-fast) var(--ease-out);\n  box-shadow: inset 1em 1em var(--cbre-white);\n}\n.cbre-checkbox:checked, .cbre-radio:checked { background: var(--cbre-green); border-color: var(--cbre-green); }\n.cbre-checkbox:checked::before, .cbre-radio:checked::before { transform: scale(1); }\n.cbre-checkbox:focus-visible, .cbre-radio:focus-visible { box-shadow: var(--shadow-focus); outline: none; }\n\n/* ---------- Switch ---------- */\n.cbre-switch { position: relative; display: inline-flex; flex: none; }\n.cbre-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: inherit; }\n.cbre-switch__track {\n  width: 42px; height: 24px; border-radius: var(--radius-pill);\n  background: var(--cbre-light-grey);\n  transition: background var(--duration-base) var(--ease-standard);\n  display: inline-flex; align-items: center; padding: 2px;\n}\n.cbre-switch__thumb {\n  width: 20px; height: 20px; border-radius: var(--radius-pill);\n  background: var(--cbre-white); box-shadow: var(--shadow-sm);\n  transition: transform var(--duration-base) var(--ease-standard);\n}\n.cbre-switch input:checked + .cbre-switch__track { background: var(--cbre-green); }\n.cbre-switch input:checked + .cbre-switch__track .cbre-switch__thumb { transform: translateX(18px); }\n.cbre-switch input:focus-visible + .cbre-switch__track { box-shadow: var(--shadow-focus); }\n\n::selection {\n  background: var(--cbre-accent-green);\n  color: var(--cbre-dark-green);\n}\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CBRE Design System — global stylesheet entry point.\n   Consuming projects link THIS file only.\n   Keep this as @import lines exclusively.\n   ============================================================ */\n\n/* ============================================================\n   CBRE Brand Webfonts\n   Financier Display — primary editorial serif (headlines)\n   Calibre          — secondary sans (body, UI, supporting)\n   Space Mono       — detail/technical copy (labels, dates)\n   ============================================================ */\n\n/* ---------- Financier Display ---------- */\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"c72a4abd-33dd-4f67-9c65-c611e47c7b2f\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"ce01c020-0718-4872-8b9e-a6c2f3454963\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"77da2c05-0736-4d5e-8eb2-bb5de9fbe055\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"37d99aa0-c0a7-486a-afc2-8fd49d40f808\") format(\"opentype\");\n  font-weight: 500;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"d4525d44-ce45-4c4c-97df-1c8ea8c891c9\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Financier Display\";\n  src: url(\"25a5f3e3-aa76-426d-acf6-382a03250618\") format(\"opentype\");\n  font-weight: 600;\n  font-style: italic;\n  font-display: swap;\n}\n\n/* ---------- Calibre ---------- */\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"61c7bf64-abb4-4286-b6d5-5917bee366fd\") format(\"opentype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"dd363430-e46b-4b41-8790-02aeaa2df8b9\") format(\"opentype\");\n  font-weight: 300;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"27464b5f-be49-45f2-8258-3a93e58ee883\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"a56b1e04-5ab8-4532-aa95-dfa65fbdc035\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"b032ac0b-9954-4ed3-ab33-7ebd729c33f5\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"bbbdec52-1bea-4718-8b03-0f726b803c7f\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Calibre\";\n  src: url(\"a9356d3e-6c0f-4c5a-9cae-578a5f2d67d2\") format(\"opentype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- Space Mono ---------- */\n@font-face {\n  font-family: \"Space Mono\";\n  src: url(\"39f16cef-df29-490a-aac9-3195e020cb8d\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   CBRE Color System — 2026 \"Global Emerald\" Brand\n   Use RGB/Hex values exactly as provided for all digital work.\n   CBRE Green leads; Accent Green is used sparingly for energy.\n   ============================================================ */\n\n:root {\n  /* ---------- Primary palette ---------- */\n  --cbre-green: #003F2D;        /* The hero. Pantone 3435 C */\n  --cbre-accent-green: #17E88F; /* Electric neon — use sparingly. Pantone 7479 C */\n  --cbre-dark-green: #012A2D;   /* Deepest surface. Pantone 627 C */\n  --cbre-dark-grey: #435254;    /* Body text on light. Pantone 431 C */\n  --cbre-light-grey: #CAD1D3;   /* Hairlines, dividers. Pantone 428 C */\n\n  /* ---------- Secondary palette (+ approved tints) ---------- */\n  --cbre-midnight: #032842;\n  --cbre-midnight-tint: #778F9C;\n  --cbre-sage: #538184;\n  --cbre-sage-tint: #96B3B6;\n  --cbre-celadon: #80BBAD;\n  --cbre-celadon-tint: #C0D4CB;\n  --cbre-wheat: #DBD99A;\n  --cbre-wheat-tint: #EFECD2;\n  --cbre-cement: #7F8480;\n  --cbre-cement-tint: #CBCDCB;\n\n  /* ---------- Neutrals ---------- */\n  --cbre-white: #FFFFFF;\n  --cbre-black: #000000;\n  /* Accent Green's lighter approved tint */\n  --cbre-accent-green-tint: #45EDA5;\n\n  /* ---------- Data visualization ---------- */\n  /* Charts & graphs (data-driven, color-blind ordered) */\n  --cbre-data-celadon: #80BBAD;\n  --cbre-data-dark-grey: #435254;\n  --cbre-data-accent-green: #17E88F;\n  --cbre-data-wheat: #DBD99A;\n  --cbre-data-blue: #1F3765;\n  --cbre-data-light-blue: #3E7CA6;\n  --cbre-data-light-grey: #CAD1D3;\n  --cbre-data-negative-red: #AD2A2A; /* Only for negative values */\n  /* Infographics & diagrams (info-driven) */\n  --cbre-data-orange: #D2785A;\n  --cbre-data-purple: #885073;\n  --cbre-data-light-purple: #A388BF;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reach for these in product/UI work\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page: var(--cbre-white);\n  --surface-raised: var(--cbre-white);\n  --surface-sunken: #F4F6F5;          /* near-white green-grey wash */\n  --surface-brand: var(--cbre-green); /* hero brand surface */\n  --surface-brand-deep: var(--cbre-dark-green);\n  --surface-inverse: var(--cbre-dark-green);\n  --surface-wheat: var(--cbre-wheat-tint);\n  --surface-celadon: var(--cbre-celadon-tint);\n\n  /* Text */\n  --text-strong: var(--cbre-green);     /* headlines on light */\n  --text-body: var(--cbre-dark-grey);   /* body — softer than black */\n  --text-muted: var(--cbre-cement);     /* captions, meta */\n  --text-on-brand: var(--cbre-white);   /* text on green surfaces */\n  --text-on-brand-muted: var(--cbre-celadon);\n  --text-accent: var(--cbre-accent-green);\n\n  /* Lines & borders */\n  --border-subtle: var(--cbre-light-grey);\n  --border-strong: var(--cbre-dark-grey);\n  --line-of-sight: var(--cbre-accent-green); /* default Line of Sight color */\n\n  /* Interactive */\n  --action-primary: var(--cbre-green);\n  --action-primary-hover: #00543C;    /* CBRE Green lightened */\n  --action-primary-press: var(--cbre-dark-green);\n  --action-accent: var(--cbre-accent-green);\n  --action-accent-hover: var(--cbre-accent-green-tint);\n  --focus-ring: var(--cbre-accent-green);\n\n  /* Feedback */\n  --feedback-negative: var(--cbre-data-negative-red);\n  --feedback-positive: var(--cbre-green);\n  --feedback-info: var(--cbre-data-light-blue);\n}\n\n/* ============================================================\n   CBRE Typography Tokens\n   Financier Display  → headlines / primary messaging (title case, never all-caps)\n   Calibre            → body, UI, supporting headlines (all-caps OK for hero)\n   Space Mono         → detail copy: labels, dates, locations (all-caps, <5 words)\n   Barlow Condensed   → dense charts/graphs only (loaded from Google Fonts)\n   ============================================================ */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7c97ab61-f5bd-4919-b37e-64f58868c3e4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f1fb6aac-3e6b-4cc7-b4c1-4bcc0db666ec\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"48e9aab7-b076-42c1-8c6a-0d15b890f52c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- Families ---------- */\n  --font-display: \"Financier Display\", \"Times New Roman\", Times, serif;\n  --font-sans: \"Calibre\", \"Tahoma\", system-ui, -apple-system, sans-serif;\n  --font-mono: \"Space Mono\", ui-monospace, \"Courier New\", monospace;\n  --font-condensed: \"Barlow Condensed\", \"Calibre\", sans-serif;\n\n  /* ---------- Weights ---------- */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---------- Display scale (Financier Display) ---------- */\n  /* Brand spec: tracking tightens & leading drops as size grows */\n  --display-1: 150px;   /* hero */\n  --display-2: 120px;\n  --display-3: 90px;\n  --display-4: 64px;\n  --display-5: 48px;\n  --display-6: 32px;\n  --display-leading-tight: 0.95;  /* >100pt */\n  --display-leading: 1;           /* 20–100pt */\n  --display-tracking-tight: -0.015em; /* ~ -5 at 100pt+ */\n  --display-tracking: 0;\n\n  /* ---------- Heading scale (Calibre supporting) ---------- */\n  --heading-1: 48px;\n  --heading-2: 32px;\n  --heading-3: 24px;\n  --heading-4: 20px;\n  --heading-leading: 1.1;\n\n  /* ---------- Body scale (Calibre) ---------- */\n  --body-lg: 20px;\n  --body-md: 16px;\n  --body-sm: 14px;\n  --body-xs: 13px;\n  --body-leading: 1.2;     /* brand spec: 120% */\n  --body-leading-relaxed: 1.5;\n\n  /* ---------- Detail / mono (Space Mono) ---------- */\n  --detail-md: 14px;\n  --detail-sm: 12px;\n  --detail-tracking: 0.04em;\n  --detail-leading: 1.3;\n\n  /* ---------- Label / eyebrow ---------- */\n  --label-md: 13px;\n  --label-sm: 11px;\n  --label-tracking: 0.08em;\n}\n\n/* ============================================================\n   CBRE Spacing, Radii, Borders, Shadows, Line of Sight\n   The brand is built on a 12-column grid, generous white space,\n   and the rectangular \"Line of Sight\" graphic element.\n   The aesthetic is crisp and architectural: minimal radius,\n   restrained shadows, square-cut corners on icons & lines.\n   ============================================================ */\n\n:root {\n  /* ---------- Spacing scale (4px base) ---------- */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---------- Layout ---------- */\n  --grid-columns: 12; /* @kind other */\n  --grid-gutter: 24px;\n  --layout-max: 1280px;\n  --layout-margin: 64px;     /* \"margins as picture frames\" */\n  --layout-margin-thin: 10px; /* professional thin photo frame */\n\n  /* ---------- Radii ----------\n     CBRE reads architectural & precise: corners are mostly square.\n     A small radius is used on interactive UI surfaces only. */\n  --radius-none: 0;\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 8px;\n  --radius-pill: 999px;\n\n  /* ---------- Borders ---------- */\n  --border-hairline: 1px;\n  --border-regular: 2px;   /* matches icon stroke weight */\n  --border-heavy: 4px;\n\n  /* ---------- Line of Sight weights (px = pt) ---------- */\n  --los-1: 1px;\n  --los-2: 2px;\n  --los-5: 5px;\n  --los-10: 10px;\n  --los-20: 20px;\n  --los-50: 50px;\n  --los-100: 100px;\n\n  /* ---------- Shadows ----------\n     Used sparingly — CBRE favors flat, confident surfaces with\n     hairline borders over heavy elevation. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(1, 42, 45, 0.06);\n  --shadow-md: 0 4px 16px rgba(1, 42, 45, 0.08);\n  --shadow-lg: 0 12px 32px rgba(1, 42, 45, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(23, 232, 143, 0.45);\n\n  /* ---------- Motion ----------\n     Calm, confident, no bounce. Short eases. */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n\n  /* ---------- Color Glaze gradient (signature background) ---------- */\n  --color-glaze: radial-gradient(120% 120% at 15% 10%, #0a5a40 0%, #00432f 38%, #012a2d 78%, #001f20 100%);\n  --color-glaze-soft: radial-gradient(140% 120% at 80% 0%, #17e88f22 0%, #00432f00 45%), linear-gradient(135deg, #003f2d 0%, #012a2d 100%);\n}\n\n/* ============================================================\n   CBRE Base — element defaults built on the token layer.\n   Applies brand type, color, and rendering defaults.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--body-md);\n  line-height: var(--body-leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n}\n\n/* Headlines default to Financier Display, CBRE Green, title-case spirit */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-medium);\n  color: var(--text-strong);\n  line-height: var(--display-leading);\n  letter-spacing: var(--display-tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\nh1 { font-size: var(--display-4); }\nh2 { font-size: var(--display-6); }\nh3 { font-size: var(--heading-3); }\nh4 { font-size: var(--heading-4); }\n\np {\n  margin: 0 0 var(--space-4);\n  line-height: var(--body-leading-relaxed);\n  text-wrap: pretty;\n}\n\na {\n  color: var(--cbre-green);\n  text-decoration: none;\n}\na:hover {\n  text-decoration: underline;\n}\n\n/* Eyebrow / detail copy convention (Space Mono, all caps) */\n.cbre-eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--detail-sm);\n  letter-spacing: var(--detail-tracking);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* The Line of Sight — signature rectangular accent */\n.cbre-los {\n  display: block;\n  background: var(--line-of-sight);\n  border: 0;\n}\n.cbre-los--h { height: var(--los-5); width: 120px; }\n.cbre-los--v { width: var(--los-5); height: 120px; }\n\n/* Button interaction states (component sets .cbre-btn--<variant>) */\n.cbre-btn:not(:disabled):active { transform: translateY(0.5px); }\n.cbre-btn--primary:not(:disabled):hover { background: var(--action-primary-hover) !important; border-color: var(--action-primary-hover) !important; }\n.cbre-btn--primary:not(:disabled):active { background: var(--action-primary-press) !important; border-color: var(--action-primary-press) !important; }\n.cbre-btn--secondary:not(:disabled):hover { background: var(--surface-sunken) !important; }\n.cbre-btn--ghost:not(:disabled):hover { background: var(--surface-sunken) !important; }\n.cbre-btn--accent:not(:disabled):hover { background: var(--action-accent-hover) !important; border-color: var(--action-accent-hover) !important; }\n.cbre-btn--inverse:not(:disabled):hover { background: var(--cbre-celadon-tint) !important; border-color: var(--cbre-celadon-tint) !important; }\n\n.cbre-input:focus, .cbre-input:focus-visible,\n.cbre-select:focus, .cbre-select:focus-visible,\n.cbre-textarea:focus, .cbre-textarea:focus-visible {\n  border-color: var(--cbre-green) !important;\n  box-shadow: var(--shadow-focus);\n}\n.cbre-input::placeholder, .cbre-textarea::placeholder { color: var(--cbre-cement); }\n\n/* ---------- Checkbox & Radio ---------- */\n.cbre-checkbox, .cbre-radio {\n  appearance: none;\n  -webkit-appearance: none;\n  width: 20px; height: 20px;\n  margin: 0; flex: none;\n  background: var(--cbre-white);\n  border: 2px solid var(--cbre-dark-grey);\n  cursor: inherit;\n  display: inline-grid; place-content: center;\n  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);\n}\n.cbre-checkbox { border-radius: var(--radius-sm); }\n.cbre-radio { border-radius: var(--radius-pill); }\n.cbre-checkbox::before {\n  content: \"\"; width: 11px; height: 11px;\n  transform: scale(0); transform-origin: center;\n  transition: transform var(--duration-fast) var(--ease-out);\n  box-shadow: inset 1em 1em var(--cbre-white);\n  clip-path: polygon(14% 44%, 0 65%, 43% 100%, 100% 16%, 80% 0%, 39% 67%);\n}\n.cbre-radio::before {\n  content: \"\"; width: 9px; height: 9px; border-radius: var(--radius-pill);\n  transform: scale(0); transition: transform var(--duration-fast) var(--ease-out);\n  box-shadow: inset 1em 1em var(--cbre-white);\n}\n.cbre-checkbox:checked, .cbre-radio:checked { background: var(--cbre-green); border-color: var(--cbre-green); }\n.cbre-checkbox:checked::before, .cbre-radio:checked::before { transform: scale(1); }\n.cbre-checkbox:focus-visible, .cbre-radio:focus-visible { box-shadow: var(--shadow-focus); outline: none; }\n\n/* ---------- Switch ---------- */\n.cbre-switch { position: relative; display: inline-flex; flex: none; }\n.cbre-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: inherit; }\n.cbre-switch__track {\n  width: 42px; height: 24px; border-radius: var(--radius-pill);\n  background: var(--cbre-light-grey);\n  transition: background var(--duration-base) var(--ease-standard);\n  display: inline-flex; align-items: center; padding: 2px;\n}\n.cbre-switch__thumb {\n  width: 20px; height: 20px; border-radius: var(--radius-pill);\n  background: var(--cbre-white); box-shadow: var(--shadow-sm);\n  transition: transform var(--duration-base) var(--ease-standard);\n}\n.cbre-switch input:checked + .cbre-switch__track { background: var(--cbre-green); }\n.cbre-switch input:checked + .cbre-switch__track .cbre-switch__thumb { transform: translateX(18px); }\n.cbre-switch input:focus-visible + .cbre-switch__track { box-shadow: var(--shadow-focus); }\n\n::selection {\n  background: var(--cbre-accent-green);\n  color: var(--cbre-dark-green);\n}\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n<\u002Fstyle>\n  <script src=\"e4997747-a1f8-49b0-97a8-201a6adf0fe0\"><\u002Fscript>\n  <style>\n    *{box-sizing:border-box}\n    html,body{margin:0;padding:0}\n    @keyframes cpipFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n    @keyframes cpipPopA{0%{transform:scale(.95)}100%{transform:scale(1)}}\n    @keyframes cpipPopB{0%{transform:scale(.95)}100%{transform:scale(1)}}\n font-display);font-size:42px;line-height:1.03;color:#fff;margin-top:12px;max-width:900px\">One Platform. One Source of Truth. Inside Your Tenancy.<\u002Fdiv>\n        <div style=\"display:flex;gap:22px;margin-top:32px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:260px;border:1px solid rgba(23,232,143,0.45);border-radius:8px;padding:22px 24px;background:rgba(0,0,0,0.16)\">\n            <div style=\"font-family:var(--font-display);font-size:52px;line-height:1;color:var(--cbre-accent-green)\">Up to 20%<\u002Fdiv>\n            <div style=\"font-size:15px;color:#DCE7E2;margin-top:8px\">reduction in reactive maintenance costs<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:260px;border:1px solid rgba(23,232,143,0.45);border-radius:8px;padding:22px 24px;background:rgba(0,0,0,0.16)\">\n            <div style=\"font-family:var(--font-display);font-size:52px;line-height:1;color:var(--cbre-accent-green)\">25%<\u002Fdiv>\n            <div style=\"font-size:15px;color:#DCE7E2;margin-top:8px\">productivity uplift from reporting time saved<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px;border-top:2px solid rgba(23,232,143,0.5);padding-top:16px;max-width:900px\">\n          <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cbre-accent-green);margin-bottom:8px\">What We Need From Microsoft<\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.45;color:#DCE7E2\">A one-time data-integration agreement so data flows securely into your environment, plus API integration between IFM Hub and Facility Link. CBRE tools operate delivery-side — no third-party code is introduced to your tenancy.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:34px;flex-wrap:wrap\">\n          <button onclick=\"{{ onReplay }}\" style=\"font-family:var(--font-sans);font-weight:600;font-size:15px;padding:13px 24px;border-radius:4px;border:none;background:var(--cbre-accent-green);color:#012A2D;cursor:pointer\">Replay Walk-through<\u002Fbutton>\n          <button onclick=\"{{ onBackToMap }}\" style=\"font-family:var(--font-sans);font-weight:600;font-size:15px;padding:13px 24px;border-radius:4px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:#fff;cursor:pointer\">Back to the Map<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"{{ tipStyle }}\">\n    <div style=\"font-family:var(--font-sans);font-weight:600;font-size:13px;color:#fff;margin-bottom:2px\">{{ tipName }}<\u002Fdiv>\n    <div style=\"font-size:11.5px;line-height:1.35;color:var(--cbre-celadon)\">{{ tipDesc }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ bubbleStyle }}\">\n    <div style=\"{{ bubblePopStyle }}\">\n      <div style=\"{{ ptUpStyle }}\"><\u002Fdiv>\n      <div style=\"{{ ptDownStyle }}\"><\u002Fdiv>\n      <div style=\"{{ ptLeftStyle }}\"><\u002Fdiv>\n      <div style=\"{{ ptRightStyle }}\"><\u002Fdiv>\n      <div style=\"background:var(--cbre-dark-green);border:1px solid {{ bubbleBorder }};border-radius:7px;padding:12px 15px 13px;width:304px;box-shadow:0 12px 34px rgba(0,0,0,0.34);text-align:left\">\n        <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cbre-accent-green);margin-bottom:5px\">{{ bubbleEyebrow }}<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-size:17px;line-height:1.06;color:#fff;margin-bottom:5px\">{{ bubbleTitle }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.4;color:var(--cbre-celadon)\">{{ bubbleText }}<\u002Fdiv>\n        <div style=\"margin-top:9px;padding-top:9px;border-top:1px solid rgba(23,232,143,0.28)\">\n          <div style=\"font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cbre-accent-green);margin-bottom:3px\">What This Solves<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.35;color:#fff\">{{ bubbleSolves }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-top:12px;pointer-events:auto\">\n          <button onclick=\"{{ bubbleBack }}\" style=\"font-family:var(--font-sans);font-weight:600;font-size:11px;padding:6px 11px;border-radius:3px;border:1px solid rgba(255,255,255,0.35);background:transparent;color:#fff;cursor:pointer\">‹ Back<\u002Fbutton>\n          <button onclick=\"{{ bubbleNext }}\" style=\"font-family:var(--font-sans);font-weight:600;font-size:11px;padding:6px 13px;border-radius:3px;border:1px solid var(--cbre-accent-green);background:var(--cbre-accent-green);color:#012A2D;cursor:pointer\">{{ bubbleNextLabel }} ›<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--cbre-celadon)\">{{ bubbleCount }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#17E88F&quot;,&quot;options&quot;:[&quot;#17E88F&quot;,&quot;#45EDA5&quot;,&quot;#00B074&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;microsoftBlue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F3765&quot;,&quot;options&quot;:[&quot;#1F3765&quot;,&quot;#0F6CBD&quot;,&quot;#2E5E8C&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;stepDurationSecs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:4,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = { phase:'intro', step:0, autoOn:false, scale:1, geom:[], hover:null };\n    this.nodes = {};\n    this.geomVer = 0;\n    this.W = 1360; this.H = 900;\n\n    this.MA = [\n      {id:'facilityLink', name:'Facility Link', desc:\"Service request & SLA management — Microsoft's system of record.\"},\n      {id:'myOrder', name:'MyOrder', desc:'Third-party purchase orders.'},\n      {id:'projectLink', name:'ProjectLink', desc:'Project management.'},\n      {id:'fusion', name:'Fusion', desc:'Project financials.'},\n      {id:'archibus', name:'Archibus', desc:'Space & occupancy.'},\n      {id:'tririga', name:'Tririga', desc:'Lease administration.'},\n      {id:'msSustain', name:'MS Sustainability', desc:'Sustainability program management (manual).'}\n    ];\n    this.MB = [\n      {id:'clFM', title:'FM Operations', chips:[\n        {id:'ifmHub', name:'IFM Hub', desc:'Self-perform & third-party work management.'},\n        {id:'inspections', name:'Inspections', desc:'Building sweeps.'},\n        {id:'inventory', name:'Inventory', desc:'Consumables & parts management.'}\n      ]},\n      {id:'financeCluster', title:'Finance & Procurement', chips:[\n        {id:'myBuy', name:'myBuy', desc:'Procure-to-pay.'},\n        {id:'agiloft', name:'Agiloft', desc:'Sourcing & contracts.'},\n        {id:'myFinance', name:'myFinance', desc:'Finance & accounting.'},\n        {id:'adaptivePlanning', name:'Adaptive Planning', desc:'Budget & forecast.'},\n        {id:'valueTrack', name:'ValueTrack', desc:'Savings & initiatives tracking.'}\n      ]},\n      {id:'clAsset', title:'Asset', chips:[\n        {id:'assetInsight', name:'Asset Insight', desc:'Lifecycle asset management & capital planning.'},\n        {id:'assetData', name:'Asset Data Collection', desc:'On-site asset data capture.'}\n      ]},\n      {id:'clAcct', title:'Account & Analytics', chips:[\n        {id:'occupancy', name:'Occupancy Optimizer', desc:'Stack & scenario planning.'},\n        {id:'kpi', name:'KPI Scorecard', desc:'Account KPI tracking.'},\n        {id:'workflow', name:'Workflow Automation', desc:'Account workflow automation.'},\n        {id:'benchmarking', name:'CBRE Benchmarking', desc:'Cross-portfolio benchmarking.'},\n        {id:'myData', name:'myData', desc:'Master data management.'}\n      ]},\n      {id:'clExp', title:'Experience', chips:[\n        {id:'experience', name:'Experience Platform', desc:'Experience sweeps, service & utilization.'}\n      ]},\n      {id:'clHSE', title:'HSE', chips:[\n        {id:'gensuite', name:'Benchmark Gensuite', desc:'HSE: safety sweeps, incidents, permits.'}\n      ]}\n    ];\n    this.MC = [\n      {id:'dataIngestStore', name:'Data Ingestion & Storage', type:'msft', desc:'MS data governance.'},\n      {id:'dataIntegration', name:'Data Integration & Transformation', type:'onaccount', desc:\"Run by CBRE's on-account tech team.\"},\n      {id:'semanticModel', name:'Semantic Modelling', type:'onaccount', desc:\"Run by CBRE's on-account tech team.\"},\n      {id:'bestPracticesC', name:'Best Practices Consultancy', type:'onaccount', desc:'CBRE platform IP.'}\n    ];\n    this.MD = [\n      {id:'edpIngest', name:'Data Ingestion', desc:'CBRE platform.'},\n      {id:'edpQuality', name:'Data Quality & Standardization', desc:'CBRE platform.'}\n    ];\n    this.ME = [\n      {id:'analytics', name:'CBRE Best-in-Class Analytics', desc:'Curated, on-brand analytics built by CBRE.'},\n      {id:'forecasting', name:'CBRE Analytics & Forecasting Engine', desc:'Predictive analytics & forecasting.'},\n      {id:'support', name:'Ongoing Support', desc:'Continuous support from CBRE on-account team.'},\n      {id:'bestPracticesE', name:'Best Practices Consultancy', desc:'CBRE platform IP.'}\n    ];\n    this.OUT = [\n      'Integrated, Advanced, Outcome-Based Reporting',\n      'AI/ML-Enabled Actionable Insights',\n      'AI-Enabled Analysis',\n      'AI-Enabled Data Interactions'\n    ];\n    this.STEPS = [\n      {n:1, title:'Service Request Integration',\n        caption:\"A two-way API links Facility Link — Microsoft's system of record — with CBRE's IFM Hub. Work orders and SLA status sync in real time. This is the one integration CBRE needs Microsoft to enable.\",\n        bubble:\"Facility Link and IFM Hub trade work orders and SLA status over one live API — the single integration we need switched on.\",\n        boxes:['facilityLink','ifmHub'], connectors:['c1']},\n      {n:2, title:'Streamlined Reconciliation',\n        caption:'For Project and Procurement data only, a lightweight manual process reconciles Microsoft systems (MyOrder, ProjectLink, Fusion) with CBRE delivery components. No automated third-party code runs in your environment here.',\n        bubble:'Project & procurement records are matched by hand — the only manual touchpoint, and no CBRE code runs inside your tenancy.',\n        boxes:['myOrder','projectLink','fusion','financeCluster','myBuy','agiloft','myFinance','adaptivePlanning','valueTrack'], connectors:['c2a','c2b','c2c']},\n      {n:3, title:'Direct Integration — Microsoft Tools',\n        caption:'Microsoft-owned systems feed their operational data straight into MSFT Fabric, governed end-to-end by Microsoft.',\n        bubble:'Every Microsoft-owned system streams its operational data straight into Fabric, under your governance.',\n        zones:['A','C'], connectors:['c3']},\n      {n:4, title:'Direct Integration — CBRE Tools',\n        caption:'CBRE-owned delivery tools feed the CBRE Enterprise Data Platform, where data is ingested, cleaned and standardized.',\n        bubble:'Every CBRE delivery tool feeds the CBRE Enterprise Data Platform, where data is cleaned and standardized.',\n        zones:['B','D'], connectors:['c4']},\n      {n:5, title:'Holistic & Enriched Operations Data',\n        caption:'CBRE EDP pushes cleaned, standardized, enriched data up into MSFT Fabric — combining both worlds into one trusted dataset.',\n        bubble:'The EDP hands its cleaned, enriched data up to Fabric — combining both worlds into one trusted dataset.',\n        zones:['C','D'], connectors:['c5']},\n      {n:6, title:'Fabric → Power BI',\n        caption:\"Fabric feeds Microsoft's system of insights. CBRE's best-in-class analytics, forecasting and AI-enabled insights are delivered inside Microsoft's environment, under Microsoft governance.\",\n        bubble:\"Fabric powers Power BI, where CBRE's analytics, forecasting and AI insights land — all inside your tenancy.\",\n        zones:['C','E'], connectors:['c6']}\n    ];\n    this.SOLVES = [\n      \"Ends duplicate work-order entry and SLA blind spots — one real-time source of truth for service requests.\",\n      \"Keeps project & procurement data aligned without exposing your systems — accuracy with zero code in your tenancy.\",\n      \"Removes manual exports — Microsoft data lands in Fabric automatically, under your governance.\",\n      \"Turns fragmented operational data into clean, standardized, analytics-ready data.\",\n      \"Breaks the silo between CBRE and Microsoft data — one trusted dataset, no reconciliation later.\",\n      \"Delivers predictive, AI-enabled insight where your teams already work — up to 20% less reactive maintenance, 25% faster reporting.\"\n    ];\n    this.CONNECTORS = [\n      {key:'c1', from:'facilityLink', to:'ifmHub', kind:'solid', bidir:true, fromSide:'bottom', toSide:'top'},\n      {key:'c2a', from:'myOrder', to:'financeCluster', kind:'dashed', fromSide:'bottom', toSide:'top'},\n      {key:'c2b', from:'projectLink', to:'financeCluster', kind:'dashed', fromSide:'bottom', toSide:'top'},\n      {key:'c2c', from:'fusion', to:'financeCluster', kind:'dashed', fromSide:'bottom', toSide:'top'},\n      {key:'c3', from:'zoneA', to:'zoneC', kind:'solid', fromSide:'right', toSide:'left'},\n      {key:'c4', from:'zoneB', to:'zoneD', kind:'solid', fromSide:'right', toSide:
